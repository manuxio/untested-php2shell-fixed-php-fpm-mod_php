; php2shell (CVE-2026-109618 / CVE-2026-109619) mitigation, on top of the official fix.
; Loaded after www.conf / docker.conf / zz-docker.conf (alphabetical include order).
; Every worker serves a single request and is then replaced, so no request can observe state
; left over by a previous one. Upload progress is pinned off: php_admin_value cannot be
; overridden by PHP_VALUE from the web server or by .user.ini files.
[www]
pm.max_requests = 1
php_admin_value[session.upload_progress.enabled] = 0
