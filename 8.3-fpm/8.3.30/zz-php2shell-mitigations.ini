; php2shell (CVE-2026-109618 / CVE-2026-109619) mitigation defaults, on top of the official fix.
; Upload progress is also pinned off for the FPM pool (php_admin_value in
; php-fpm.d/zz-php2shell-mitigations.conf), which .user.ini / ini_set() cannot override.
; A FastCGI PHP_VALUE set in the web server config still can (stock FPM behaviour); that
; channel is not reachable by clients.
; memory_limit = -1 keeps the (now delayed / hard-limit) OOM paths out of reach of
; attacker-controlled request sizes; override it downstream if you need a PHP-level cap.
session.upload_progress.enabled = 0
memory_limit = -1
