; php2shell (CVE-2026-109618 / CVE-2026-109619) mitigation defaults.
; Upload progress is also disabled in the patched source regardless of this setting.
; memory_limit = -1 avoids the (now fatal, worker-killing) OOM path being reachable via
; attacker-controlled request sizes; override it downstream if you need a PHP-level cap.
session.upload_progress.enabled = 0
memory_limit = -1
